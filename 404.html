<!DOCTYPE html>
<html lang="zh-CN" style="overflow: clip;">
    <head>
        <title>404 - CDMusic</title>
        <link rel="icon" href="//m.ccw.site/works-covers/cdmusic-icon-v3.1.svg">
        <meta name="darkreader-lock">
        <style>
            body {
                margin: 0;
                color: #fff;
            }

            .loading {
                position: absolute;
                inset: 0;
                background: #000;
                display: grid !important;
                justify-items: center;
                align-content: center;
                overflow: hidden;
                color: #fff;
                z-index: 10;
                & > img {
                    zoom: .7;
                    filter: grayscale(1);
                }
                & > span {
                    margin-top: 40px;
                }
            }
        </style>
    </head>
    <body style="background: #000; font-family: 'PingFang';">
        <div class="loading">
            <img src="//m.ccw.site/works-covers/cdmusic-icon-v3.1.svg">
            <span>404 Not Found</span>
        </div>
    </body>
</html>
