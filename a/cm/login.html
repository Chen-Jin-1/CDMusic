<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷狗登录测试</title>
    <style>
        body { font-family: system-ui; max-width: 400px; margin: 2rem auto; padding: 1rem; }
        .form-group { margin-bottom: 1rem; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.7rem; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #log { margin-top: 1rem; padding: 1rem; background: #f5f5f5; border-radius: 4px; white-space: pre-wrap; max-height: 350px; overflow-y: auto; font-size: 0.9rem; }
        .step { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
        .step button { flex: 1; }
    </style>
</head>
<body>
    <h2>📱 酷狗登录测试</h2>
    <div class="form-group">
        <label>手机号</label>
        <input type="tel" id="phone" placeholder="13800138000">
    </div>
    <div class="form-group">
        <label>验证码</label>
        <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="code" placeholder="6位数字" style="flex:1;">
            <button id="btnSendCode" style="width:auto; padding:0.5rem 1rem; flex-shrink:0;">发送</button>
        </div>
    </div>
    <button id="btnLogin">登录</button>
    <div id="log">📝 日志将显示在这里...</div>

    <!-- 2. 主脚本 (ESM 模块) -->
    <script type="module">
        import { captcha_sent } from './captcha_sent.js';
        import { login_cellphone } from './login_cellphone.js';

        const phoneInput = document.getElementById('phone');
        const codeInput = document.getElementById('code');
        const btnSendCode = document.getElementById('btnSendCode');
        const btnLogin = document.getElementById('btnLogin');
        const logDiv = document.getElementById('log');

        function log(msg, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            let text = `[${timestamp}] ${msg}`;
            if (data) {
                text += '\n' + JSON.stringify(data, null, 2);
            }
            logDiv.textContent = text + '\n\n' + logDiv.textContent;
            console.log(msg, data);
        }

        btnSendCode.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            if (!phone || phone.length < 11) {
                alert('请输入正确的手机号');
                return;
            }

            btnSendCode.disabled = true;
            log(`📤 发送验证码到 ${phone}...`);

            try {
                const result = await captcha_sent({ phone });
                log('📨 验证码发送响应', result.body);

                if (result.body?.code === 200) {
                    log('✅ 验证码已发送，请查收短信');
                } else {
                    log('❌ 发送失败', result.body);
                }
            } catch (e) {
                log('❌ 请求异常', e.body || e);
            } finally {
                btnSendCode.disabled = false;
            }
        });

        // ---- 登录 ----
        btnLogin.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            const captcha = codeInput.value.trim();
            if (!phone || !captcha) {
                alert('请输入手机号和验证码');
                return;
            }

            btnLogin.disabled = true;
            log(`🔐 开始登录: ${phone}`);

            try {
                const result = await login_cellphone({ phone, captcha });
                log('🔓 登录响应', result.body);

                if (result.body?.code === 200) {
                    const profile = result.body.profile || {};
                    log(`🎉 登录成功！`);
                    log(`   昵称: ${profile.nickname}`);
                    log(`   用户ID: ${profile.userId}`);
                    log(`   头像: ${profile.avatarUrl}`);
                    // 检查 localStorage
                    log('📦 localStorage 已保存 Cookie:', !!localStorage.getItem('netease_cookie'));
                    log('📦 localStorage 已保存 __csrf:', !!localStorage.getItem('netease_csrf'));
                } else {
                    log('❌ 登录失败', result.body);
                }
            } catch (e) {
                log('❌ 请求异常', e.body || e);
            } finally {
                btnLogin.disabled = false;
            }
        });

        log('🚀 页面已加载，请确保 lib/ 目录下有 crypto-js.js 和 forge.min.js');
        log('💡 操作步骤：输入手机号 → 点击「发送」→ 输入验证码 → 点击「登录」');
    </script>
</body>
</html>
