<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐登录 - CDMusic</title>
    <link rel="stylesheet" href="https://www.chen-jin.dpdns.org/assets/jx.css">
    <style>
        .login-card {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 40px 32px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
        }

        .login-card h2 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 32px;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            color: var(--text-primary);
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--glow-color);
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .code-row {
            display: flex;
            gap: 10px;
        }

        .code-row input {
            flex: 1 1 auto;
            min-width: 0;
        }

        .code-row .btn {
            flex-shrink: 0;
            padding: 12px 20px;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            margin-top: 8px;
        }

        .message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            min-height: 20px;
        }

        .message.success { color: #4ade80; }
        .message.error { color: #f87171; }

        /* 淡入动画 */
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
    </style>
</head>
<body class="flex-center fade-in">

    <div class="login-card">
        <h2>网易云音乐登录</h2>

        <div class="form-group">
            <label>手机号</label>
            <input type="tel" id="phone">
        </div>

        <div class="form-group">
            <label>验证码</label>
            <div class="code-row">
                <input type="text" id="code" placeholder="4 位数字">
                <button class="btn" id="btnSendCode">发送</button>
            </div>
        </div>

        <button class="btn next btn-submit" id="btnLogin">登录</button>

        <div class="message" id="message"></div>
    </div>

    <script type="module">
        import { captcha_sent, login_cellphone } from './module.js';

        const phoneInput = document.getElementById('phone');
        const codeInput = document.getElementById('code');
        const btnSendCode = document.getElementById('btnSendCode');
        const btnLogin = document.getElementById('btnLogin');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type = '') {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }

        // 发送验证码
        btnSendCode.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            if (!phone || phone.length < 11) {
                showMessage('请输入正确的手机号', 'error');
                return;
            }

            btnSendCode.disabled = true;
            showMessage('发送中...');

            try {
                const result = await captcha_sent({ phone });
                if (result.body?.code === 200) {
                    showMessage('验证码已发送', 'success');
                } else {
                    showMessage(result.body?.message || '发送失败', 'error');
                }
            } catch (e) {
                showMessage('请求异常', 'error');
            } finally {
                btnSendCode.disabled = false;
            }
        });

        // 登录
        btnLogin.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            const captcha = codeInput.value.trim();
            if (!phone || !captcha) {
                showMessage('请输入手机号和验证码', 'error');
                return;
            }

            btnLogin.disabled = true;
            showMessage('登录中...');

            try {
                const result = await login_cellphone({ phone, captcha });
                if (result.body?.code === 200) {
                    const nickname = result.body.profile?.nickname || '用户';
                    showMessage(`欢迎，${nickname}`, 'success');
                    // 登录成功后可以跳转
                    // setTimeout(() => location.href = './index.html', 1000);
                } else {
                    showMessage(result.body?.message || '登录失败', 'error');
                }
            } catch (e) {
                showMessage('请求异常', 'error');
            } finally {
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
