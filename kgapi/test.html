<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷狗登录测试</title>
    <style>
        body { font-family: system-ui; max-width: 400px; margin: 2rem auto; padding: 1rem; }
        .form-group { margin-bottom: 1rem; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.7rem; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #log { margin-top: 1rem; padding: 1rem; background: #f5f5f5; border-radius: 4px; white-space: pre-wrap; max-height: 350px; overflow-y: auto; font-size: 0.9rem; }
        .step { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
        .step button { flex: 1; }
    </style>
</head>
<body>
    <h2>📱 酷狗登录测试</h2>
    <div class="form-group">
        <label>手机号</label>
        <input type="tel" id="phone" placeholder="13800138000">
    </div>
    <div class="form-group">
        <label>验证码</label>
        <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="code" placeholder="6位数字" style="flex:1;">
            <button id="btnSendCode" style="width:auto; padding:0.5rem 1rem; flex-shrink:0;">发送</button>
        </div>
    </div>
    <button id="btnLogin">登录</button>
    <div id="log">📝 日志将显示在这里...</div>

    <!-- 2. 主脚本 (ESM 模块) -->
    <script type="module">
        import { captcha_sent } from 'https://cdmsc.chen-jin.dpdns.org/kgapi/captcha_sent.js';
        import { login_cellphone } from 'https://cdmsc.chen-jin.dpdns.org/kgapi/login_cellphone.js';

        const phoneInput = document.getElementById('phone');
        const codeInput = document.getElementById('code');
        const btnSendCode = document.getElementById('btnSendCode');
        const btnLogin = document.getElementById('btnLogin');
        const logDiv = document.getElementById('log');

        function log(msg, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            let text = `[${timestamp}] ${msg}`;
            if (data) {
                text += '\n' + JSON.stringify(data, null, 2);
            }
            logDiv.textContent = text + '\n\n' + logDiv.textContent;
            console.log(msg, data);
        }

        btnSendCode.addEventListener('click', async () => {
            const mobile = phoneInput.value.trim();
            if (!mobile || mobile.length < 11) {
                alert('请输入正确的手机号');
                return;
            }

            btnSendCode.disabled = true;
            log(`📤 发送验证码到 ${mobile}...`);

            try {
                // 生成一个临时 mid（实际应该从 register_dev 获取，这里先随便给一个）
                const tempMid = '0';
                const result = await captcha_sent({
                    mobile: mobile,
                    cookie: { KUGOU_API_MID: tempMid }
                });

                log('📨 验证码发送响应', result);

                if (result.body?.status === 1) {
                    log('✅ 验证码已发送，请查收短信');
                } else {
                    log('❌ 发送失败', result.body);
                }
            } catch (e) {
                log('❌ 请求异常', e);
            } finally {
                btnSendCode.disabled = false;
            }
        });

        // ---- 登录 ----
        btnLogin.addEventListener('click', async () => {
            const mobile = phoneInput.value.trim();
            const code = codeInput.value.trim();
            if (!mobile || !code) {
                alert('请输入手机号和验证码');
                return;
            }

            btnLogin.disabled = true;
            log(`🔐 开始登录: ${mobile}`);

            try {
                const result = await login_cellphone({
                    mobile: mobile,
                    code: code,
                    cookie: {}  // 如果有之前保存的 cookie 可以传入
                });

                log('🔓 登录响应', result);

                if (result.body?.status === 1) {
                    const data = result.body.data || {};
                    log(`🎉 登录成功！`);
                    log(`   token: ${data.token?.substring(0, 20)}...`);
                    log(`   userid: ${data.userid}`);
                    log(`   vip_type: ${data.vip_type}`);
                    // 保存 token 到 localStorage
                    if (data.token) localStorage.setItem('kugou_token', data.token);
                    if (data.userid) localStorage.setItem('kugou_userid', data.userid);
                } else {
                    log('❌ 登录失败', result.body);
                }
            } catch (e) {
                log('❌ 请求异常', e);
            } finally {
                btnLogin.disabled = false;
            }
        });

        log('🚀 页面已加载，请确保 lib/ 目录下有 crypto-js.js 和 forge.min.js');
        log('💡 操作步骤：输入手机号 → 点击「发送」→ 输入验证码 → 点击「登录」');
    </script>
</body>
</html>
